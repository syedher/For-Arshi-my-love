<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter For You ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Special+Elite&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="letter.css">

</head>

<body>

    <!-- Floating Decorations -->
    <div id="flowers"></div>

    <!-- Main Scene -->
    <div class="letter-scene">

        <!-- Polaroid 1 -->
        <div class="polaroid top-left">
            <img src="photo1.jpg" alt="Memory 1">
            <p>Our First Selfie ❤️</p>
        </div>

        <!-- Polaroid 2 -->
        <div class="polaroid top-right">
            <img src="photo2.jpg" alt="Memory 2">
            <p>Beautiful You🌸</p>
        </div>

        <!-- Vintage Letter -->
        <div class="letter">

            <div class="wax-seal">❤</div>

            <h1>To My Beautiful Girl,</h1>

            <p id="letterText"></p>

            <button id="continueBtn" >
                Continue ❤️
            </button>

        </div>

        <!-- Polaroid 3 -->
        <div class="polaroid bottom-left">
            <img src="photo3.jpg" alt="Memory 3">
            <p>Cutie pie </p>
        </div>

        <!-- Polaroid 4 -->
        <div class="polaroid bottom-right">
            <img src="photo8.jpg" alt="Memory 4">
            <p>Forever Us ❤️</p>
        </div>

    </div>

    <script src="letter.js"></script>

</body>

</html>
