<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forever ❤️</title>

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="final.css">

</head>

<body>

    <!-- Animated Background -->

    <div id="stars"></div>

    <div id="petals"></div>

    <div id="hearts"></div>

    <div id="fireflies"></div>

    <div id="sparkles"></div>

    <div class="moon"></div>

    <!-- Main Content -->

    <main class="container">

        <!-- Polaroids -->

        <div class="polaroid p1">
            <img src="photo1.jpg">
            <span>Our Beginning ❤️</span>
        </div>

        <div class="polaroid p2">
            <img src="photo2.jpg">
            <span>My Favorite Smile 🌸</span>
        </div>

        <div class="polaroid p3">
            <img src="photo3.jpg">
            <span>My Safe Place 🤍</span>
        </div>

        <div class="polaroid p4">
            <img src="photo4.jpg">
            <span>Forever Us</span>
        </div>

        <!-- Center Card -->

        <section class="glass">

            <div class="heart">

                ❤️

            </div>

            <h1>

                Happy Girlfriend's Day

            </h1>

            <h2>

                Arshi ❤️

            </h2>

            <p id="loveLetter"></p>

            <button id="forever">

                Forever?

            </button>

            <p id="ps">

                P.S. Thank you for making my world brighter every single day. ❤️

            </p>

        </section>

    </main>

    <!-- Footer -->

    <footer>

        Made with endless love ❤️

    </footer>

    <!-- Music -->

    <audio id="endingMusic">

        <source src="music/final.mp3" type="audio/mpeg">

    </audio>

    <!-- Confetti -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script src="final.js"></script>

</body>

</html>
