<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just Listen... ❤️</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="song.css">

</head>

<body>

    <!-- Sky Elements -->
    <!--<div id="stars"></div>
    <div id="fireflies"></div>
    <div id="petals"></div>
    <div id="floatingHearts"></div>-->

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <!-- Main Content -->
    <main class="container">

        <div class="glass-card">

            <div class="music-icon">
                🎧
            </div>

            <h1>
                This Song...
            </h1>

            <p class="subtitle">
                Every time I listen to it,
                it reminds me of you.
            </p>

            <!-- Album Art -->
            <div class="album">

                <img src="photo4.jpg" alt="Album Cover">

                <div class="vinyl"></div>

            </div>

            <!-- Music Controls -->

            <audio id="song" controls>
                <source src="music.mp3" type="audio/mpeg">
            </audio>

            <p class="message">
                When I close my Eyes <br>
                And Listen carefully...
                <br>
                I think about You. ❤️
            </p>

            <button id="continueBtn">
                Continue →
            </button>

        </div>

    </main>

    <!-- Floating Quote -->

    <div class="quote">

        "Some songs don't just play...
        they become memories."

    </div>

    <!-- Shooting Star -->

    <div class="shooting-star"></div>

    <!-- Background Music Effects -->
    <audio id="clickSound">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script src="song.js"></script>

</body>

</html>
